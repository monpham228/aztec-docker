name: aztec-node
services:
  node:
    image: aztecprotocol/aztec:0.85.0-alpha-testnet.5
    env_file:
      - .env
    entrypoint: >
      sh -c 'node --no-warnings /usr/src/yarn-project/aztec/dest/bin/index.js start --network alpha-testnet start --node --archiver --sequencer'
    ports:
      # - 40400:40400/tcp
      # - 40400:40400/udp
      - 8580:8080
    volumes:
      - ./aztec:/data # Local directory